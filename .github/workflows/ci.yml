name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base. Filtering on `branches: [main]`
  # here would filter on the *base* branch, silently skipping stacked pull
  # requests that target another branch -- which is exactly when a check is
  # most useful.
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lcw-front-end
    steps:
      # package.json links @digitalcredentials/batch-issuer-ui as
      # file:../batch-issuer-ui, so the two repos are checked out side by side
      # and the panel is built before this repo's install can resolve it. It
      # tracks batch-issuer-ui's default branch, as a local sibling checkout
      # would.
      - uses: actions/checkout@v6
        with:
          path: lcw-front-end

      - uses: actions/checkout@v6
        with:
          repository: digitalcredentials/batch-issuer-ui
          path: batch-issuer-ui

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            lcw-front-end/package-lock.json
            batch-issuer-ui/package-lock.json

      - name: Build batch-issuer-ui
        working-directory: batch-issuer-ui
        run: npm ci && npm run build

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

# The Playwright suite (`npm run test:e2e`) is deliberately not run here. It
# drives a real deployed instance, or the three-service local stack described
# in AGENTS.md, and needs AWS credentials or the local substitutes for both.
# Running it in CI is a separate piece of work.
