name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

# The Playwright suite (`npm run test:e2e`) is deliberately not run here. It
# drives a real deployed instance, or the three-service local stack described
# in AGENTS.md, and needs AWS credentials or the local substitutes for both.
# Running it in CI is a separate piece of work.
